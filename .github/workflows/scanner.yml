name: NSE 09:45 Telegram Scanner

on:

  # Automatic execution.
  #
  # GitHub Actions uses UTC.
  #
  # 04:20 UTC = 09:50 IST
  #
  # This is deliberately after 09:45 so that the
  # 09:30-09:45 candle has time to become available.

  schedule:
    - cron: "20 4 * * 1-5"

  # Allows you to manually execute the same scanner.
  workflow_dispatch:


jobs:

  scan:

    name: Run NSE Scanner

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Python
      # ----------------------------------------------------------

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

          cache: "pip"


      # ----------------------------------------------------------
      # Dependencies
      # ----------------------------------------------------------

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ----------------------------------------------------------
      # Run scanner
      # ----------------------------------------------------------

      - name: Run NSE 09:45 scanner

        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          python main.py
